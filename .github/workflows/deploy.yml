name: Deploy to AWS ECS via Docker Hub

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Set up Java Environment to build the project JAR file
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Change to '21' if your pom.xml uses Java 21
          distribution: 'temurin'
          cache: 'maven'

      # Step 2: Compile the Spring Boot application (Generates target/*.jar)
      - name: Build and Package App with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # Step 3: Authenticate with Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build your Docker image and push it to your Docker Hub Registry
      - name: Build and Push Docker Image
        run: |
          docker build -t sushmakandapu/employee-api:latest .
          docker push sushmakandapu/employee-api:latest

      # Step 5: Authenticate with your AWS Account using Access Keys
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Step 6: Trigger AWS ECS to instantly pull the new image from Docker Hub
      - name: Force ECS Update
        run: |
          aws ecs update-service --cluster employee-cluster --service employee-service --force-new-deployment
