name: Deploy to AWS ECS via Docker Hub

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Setup Java
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Step 2: Build with detailed error tracing turned on (--errors -X)
      - name: Build and Package App with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests --errors

      # Step 3: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build and Push Docker Image
      - name: Build and Push Docker Image
        run: |
          docker build -t sushmakandapu/employee-api:${{ github.sha }} .
          docker push sushmakandapu/employee-api:${{ github.sha }}

      # Step 5: Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Step 6: Force ECS Update
      - name: Force ECS Update
        run: |
          aws ecs update-service \
            --cluster employee-cluster \
            --service employee-service \
            --force-new-deployment \
            --task-definition employee-api-task
